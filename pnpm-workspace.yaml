packages:
  - apps/*
  - packages/*
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - prisma
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  esbuild: true
  prisma: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.31 || 58.1.18'
  - '@expo/router-server@57.0.13 || 58.0.20'
  - babel-preset-expo@57.0.16 || 58.0.23
  - expo@57.0.30 || 58.0.22
  - '@expo/config@58.0.10'
  - '@expo/fingerprint@0.21.8'
  - '@expo/local-build-cache-provider@58.0.10'
  - '@expo/log-box@58.0.14'
  - '@expo/metro-config@58.0.20'
  - '@expo/prebuild-config@58.0.18'
  - '@expo/schema-utils@58.0.3'
  - expo-audio@58.0.11
  - expo-modules-core@58.0.29
